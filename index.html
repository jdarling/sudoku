<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/android-chrome-512x512.png"
    />
    <meta name="msapplication-TileImage" content="icons/mstile-150x150.png" />
    <meta name="msapplication-TileColor" content="#f5f0e8" />
    <link rel="stylesheet" href="style/layout.css" />
    <link rel="stylesheet" href="style/themes/default.css" data-theme-link />
  </head>
  <body>
    <div id="app">
      <h1>Sudoku</h1>
      <div id="status"></div>
      <div id="game-shell">
        <div id="board-column">
          <table id="grid"></table>
        </div>
        <div id="control-panel">
          <div id="top-controls">
            <button class="action-btn" id="solve-btn">Solve</button>
            <button class="action-btn" id="new-btn">New Game</button>
            <button class="action-btn" id="load-btn">Load Game</button>
            <button class="action-btn" id="options-btn">Options</button>
          </div>
          <div id="controls">
            <button class="num-btn" data-n="1">1</button>
            <button class="num-btn" data-n="2">2</button>
            <button class="num-btn" data-n="3">3</button>
            <button class="num-btn" data-n="4">4</button>
            <button class="num-btn" data-n="5">5</button>
            <button class="num-btn" data-n="6">6</button>
            <button class="num-btn" data-n="7">7</button>
            <button class="num-btn" data-n="8">8</button>
            <button class="num-btn" data-n="9">9</button>
            <button class="num-btn erase" data-n="0">Erase</button>
          </div>
          <div id="action-row">
            <button class="action-btn" id="check-btn">Check</button>
            <button class="action-btn" id="hint-btn">Hint</button>
          </div>
        </div>
      </div>
      <div id="load-modal" aria-hidden="true">
        <div
          id="load-modal-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="load-modal-title"
        >
          <h2 id="load-modal-title">Load Puzzle</h2>
          <label for="load-filter-input">Filter puzzles</label>
          <input
            id="load-filter-input"
            type="text"
            placeholder="Filter by id, name, level, author, description, or path"
          />
          <div id="load-modal-table-wrap">
            <table id="load-modal-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Level</th>
                  <th>Author</th>
                  <th>Path</th>
                </tr>
              </thead>
              <tbody id="load-puzzle-table-body"></tbody>
            </table>
          </div>
          <div id="load-modal-status" aria-live="polite"></div>
          <div id="load-modal-actions">
            <button class="action-btn" id="load-cancel-btn" type="button">
              Cancel
            </button>
            <button class="action-btn" id="load-url-btn" type="button">
              Load URL
            </button>
            <button class="action-btn" id="load-board-btn" type="button">
              Enter Board
            </button>
            <button
              class="action-btn"
              id="load-select-btn"
              type="button"
              disabled
            >
              Select
            </button>
          </div>
        </div>
      </div>
      <div id="url-load-modal" aria-hidden="true">
        <div
          id="url-load-modal-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="url-load-modal-title"
        >
          <h2 id="url-load-modal-title">Load Puzzle from URL</h2>
          <label for="url-load-input">Puzzle URL</label>
          <input
            id="url-load-input"
            type="url"
            placeholder="https://example.com/puzzle.yaml"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="url-load-error" aria-live="polite"></div>
          <div id="url-load-modal-actions">
            <button class="action-btn" id="url-load-cancel-btn" type="button">
              Cancel
            </button>
            <button
              class="action-btn"
              id="url-load-confirm-btn"
              type="button"
              disabled
            >
              Load
            </button>
          </div>
        </div>
      </div>
      <div id="board-entry-modal" aria-hidden="true">
        <div
          id="board-entry-modal-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="board-entry-modal-title"
        >
          <h2 id="board-entry-modal-title">Enter Board</h2>
          <label for="board-entry-input">Paste or type a Sudoku board</label>
          <textarea
            id="board-entry-input"
            rows="9"
            placeholder="Any format: 53..7....6..195....98....6.8...6...34..8.3..17...2...6.6....28....419..5....8..79"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <div id="board-entry-error" aria-live="polite"></div>
          <div id="board-entry-modal-actions">
            <button
              class="action-btn"
              id="board-entry-cancel-btn"
              type="button"
            >
              Cancel
            </button>
            <button
              class="action-btn"
              id="board-entry-confirm-btn"
              type="button"
              disabled
            >
              Load
            </button>
          </div>
        </div>
      </div>
      <div id="options-modal" aria-hidden="true">
        <div
          id="options-modal-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="options-modal-title"
        >
          <h2 id="options-modal-title">Options</h2>
          <div class="options-field">
            <label for="options-theme-select">Theme</label>
            <select id="options-theme-select">
              <option value="default">Default</option>
              <option value="dark">Dark</option>
              <option value="terminal">Terminal</option>
              <option value="sepia">Sepia/Vintage</option>
              <option value="forest">Forest</option>
              <option value="ocean">Ocean/Water</option>
              <option value="sunset">Sunset</option>
              <option value="high-contrast">High Contrast</option>
              <option value="cyberpunk">Cyberpunk/Neon</option>
            </select>
          </div>
          <div class="options-field">
            <label>Related Cell Highlighting</label>
            <div id="options-highlight-presets">
              <button class="action-btn" id="preset-none-btn" type="button">
                None
              </button>
              <button class="action-btn" id="preset-same-btn" type="button">
                Same
              </button>
              <button class="action-btn" id="preset-minimal-btn" type="button">
                Minimal
              </button>
              <button
                class="action-btn"
                id="preset-related-block-btn"
                type="button"
              >
                Related Block
              </button>
              <button
                class="action-btn"
                id="preset-related-all-btn"
                type="button"
              >
                Related All
              </button>
            </div>
            <div id="options-highlight-features">
              <label class="feature-option" for="feature-same-value-rows">
                <input
                  id="feature-same-value-rows"
                  type="checkbox"
                  value="same value rows"
                />
                Same Value Rows
              </label>
              <label class="feature-option" for="feature-same-value-cols">
                <input
                  id="feature-same-value-cols"
                  type="checkbox"
                  value="same value cols"
                />
                Same Value Cols
              </label>
              <label class="feature-option" for="feature-same-value-blocks">
                <input
                  id="feature-same-value-blocks"
                  type="checkbox"
                  value="same value blocks"
                />
                Same Value Blocks
              </label>
              <label class="feature-option" for="feature-selected-row">
                <input
                  id="feature-selected-row"
                  type="checkbox"
                  value="selected row"
                />
                Selected Row
              </label>
              <label class="feature-option" for="feature-selected-col">
                <input
                  id="feature-selected-col"
                  type="checkbox"
                  value="selected col"
                />
                Selected Col
              </label>
              <label class="feature-option" for="feature-selected-block">
                <input
                  id="feature-selected-block"
                  type="checkbox"
                  value="selected block"
                />
                Selected Block
              </label>
              <label class="feature-option" for="feature-same-value">
                <input
                  id="feature-same-value"
                  type="checkbox"
                  value="same value"
                />
                Same Value Cells
              </label>
              <label class="feature-option" for="feature-immediate-errors">
                <input
                  id="feature-immediate-errors"
                  type="checkbox"
                  value="immediate errors"
                />
                Immediate Errors
              </label>
              <label class="feature-option" for="feature-error-cells">
                <input
                  id="feature-error-cells"
                  type="checkbox"
                  value="error cells"
                />
                Error Cells
              </label>
            </div>
          </div>
          <div id="options-modal-actions">
            <button class="action-btn" id="options-close-btn" type="button">
              Close
            </button>
          </div>
        </div>
      </div>
      <div id="decision-modal" aria-hidden="true">
        <div
          id="decision-modal-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="decision-modal-message"
        >
          <p id="decision-modal-message"></p>
          <div id="decision-modal-actions"></div>
        </div>
      </div>
      <div id="version"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/styler.js"></script>
    <script src="js/state.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/render.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/options.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/table.js"></script>
    <script src="js/components/loadmodal.js"></script>
    <script src="js/components/urlloadmodal.js"></script>
    <script src="js/components/boardentrymodal.js"></script>
    <script src="js/components/decisionmodal.js"></script>
    <script src="js/components/confirmmodal.js"></script>
    <script src="js/components/newgamedecisionmodal.js"></script>
    <script src="js/components/optionsmodal.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
