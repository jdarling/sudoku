name: Test and Sync Puzzles

on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Generate puzzle index
        run: node tools/generate-puzzle-index.js

      - name: Run tests
        run: node tests/run-node-tests.js --report-only-failures --report-status

      - name: Report test failure
        if: failure()
        run: |
          echo "::error::Tests failed. Merge blocked."
          exit 1
